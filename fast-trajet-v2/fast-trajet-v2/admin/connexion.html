<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fast Trajet — Connexion administrateur</title>

    <link
        rel="stylesheet"
        href="connexion.css"
    >

</head>

<body>

<main class="connexion-page">

    <section class="connexion-card">

        <div class="logo">
            🚕
        </div>

        <h1>
            Fast Trajet
        </h1>

        <p class="sous-titre">
            Administration
        </p>


        <form id="connexionForm">

            <div class="champ">

                <label for="email">
                    Adresse e-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="administrateur@fasttrajet.com"
                    required
                >

            </div>


            <div class="champ">

                <label for="mot_de_passe">
                    Mot de passe
                </label>

                <input
                    type="password"
                    id="mot_de_passe"
                    name="mot_de_passe"
                    placeholder="Votre mot de passe"
                    required
                >

            </div>


            <div
                id="message"
                class="message"
            ></div>


            <button
                type="submit"
                id="connexionButton"
            >
                Se connecter
            </button>

        </form>

    </section>

</main>


<script src="connexion.js"></script>

</body>

</html>
